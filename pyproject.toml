[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irondome"
version = "0.3.0"
description = "Iron Dome — deterministic runtime sandbox and behavioral analysis for supply-chain security"
readme = "README.md"
license = {text = "KirkForge Personal Use License"}
requires-python = ">=3.10"
authors = [{name = "KirkForge", email = "kirk@kirkforge.dev"}]
maintainers = [{name = "KirkForge", email = "kirk@kirkforge.dev"}]
keywords = [
    "sandbox",
    "seccomp",
    "seatbelt",
    "behavioral-analysis",
    "supply-chain",
    "security",
    "deterministic",
    "irondome",
    "shogun",
    "command-center",
    "runtime",
    "npm",
    "python",
    "devsecops",
    "ci-cd",
    "cyclonedx",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: Free For Educational Use",
    "License :: Free For Home Use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/KirkForge/IronDome"
Documentation = "https://github.com/KirkForge/IronDome#readme"
Repository = "https://github.com/KirkForge/IronDome"
Issues = "https://github.com/KirkForge/IronDome/issues"
Changelog = "https://github.com/KirkForge/IronDome/blob/main/CHANGELOG.md"
Commercial = "https://github.com/KirkForge/Shogun"
"Release Notes" = "https://github.com/KirkForge/IronDome/releases"
"Source Code" = "https://github.com/KirkForge/IronDome"
"Bug Tracker" = "https://github.com/KirkForge/IronDome/issues"

[project.scripts]
irondome = "irondome.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pyyaml>=6.0",
    "mypy>=1.0",
    "ruff>=0.8",
    "build>=1.0",
    "twine>=5.0",
    "types-PyYAML",
]
sigstore = [
    "sigstore>=3.0",
    "types-PyYAML",
]
all = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["irondome*"]

[tool.setuptools.package-data]
irondome = ["py.typed", "docs/rules/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
timeout = 120
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "N806", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["build/", "dist/", ".venv/"]

[tool.coverage.run]
source = ["irondome"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "@abstract",
]
fail_under = 42

# Future: switch to setuptools_scm for git tag versioning
# [tool.setuptools_scm]
# fallback_version = "0.0.0"