[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picodome"
version = "0.5.0"
description = "PicoDome — deterministic runtime sandbox and behavioral analysis for supply-chain security"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE*", "COMMERCIAL-LICENSE.md"]
requires-python = ">=3.10"
authors = [{name = "Henrik Kirk", email = "kirk@kirkforge.dev"}]
maintainers = [{name = "KirkForge", email = "kirk@kirkforge.dev"}]
keywords = [
    "sandbox",
    "seccomp",
    "seatbelt",
    "behavioral-analysis",
    "supply-chain",
    "security",
    "deterministic",
    "picodome",
    "shogun",
    "command-center",
    "runtime",
    "npm",
    "python",
    "devsecops",
    "ci-cd",
    "cyclonedx",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/KirkForge/PicoDome"
Documentation = "https://github.com/KirkForge/PicoDome#readme"
Repository = "https://github.com/KirkForge/PicoDome"
Issues = "https://github.com/KirkForge/PicoDome/issues"
Changelog = "https://github.com/KirkForge/PicoDome/blob/main/CHANGELOG.md"
Commercial = "https://github.com/KirkForge/PicoShogun"
"Release Notes" = "https://github.com/KirkForge/PicoDome/releases"
"Source Code" = "https://github.com/KirkForge/PicoDome"
"Bug Tracker" = "https://github.com/KirkForge/PicoDome/issues"

[project.scripts]
picodome = "irondome.cli:main"
irondome = "irondome.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pyyaml>=6.0",
    "mypy>=1.0",
    "ruff>=0.8",
    "build>=1.0",
    "twine>=5.0",
    "types-PyYAML",
]
sigstore = [
    "sigstore>=3.0",
    "types-PyYAML",
]
all = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["irondome*"]

[tool.setuptools.package-data]
irondome = ["py.typed", "docs/rules/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
timeout = 120
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "N806", "N818", "N802", "N812", "A002", "B007", "B905", "SIM105", "SIM102", "SIM108", "SIM117", "C416"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["build/", "dist/", ".venv/"]

[tool.coverage.run]
source = ["irondome"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "@abstract",
]
fail_under = 70

# Future: switch to setuptools_scm for git tag versioning
# [tool.setuptools_scm]
# fallback_version = "0.0.0"

[tool.picodome.reproducible]
# Reproducible build configuration for PicoDome.
# PicoDome's core thesis is determinism — builds MUST be bit-for-bit reproducible.
source_date_epoch = "env"  # Read from SOURCE_DATE_EPOCH env var ("env") or fixed integer
python_hash_seed = 0       # Fixed hash seed for deterministic dict ordering
require_hashes = true      # All deps must be pinned with hashes (pip --require-hashes)
no_build_isolation = true  # Don't use pip's build isolation (--no-build-isolation)
offline = true             # No network access during build (--offline)
hash_algorithm = "sha256"  # Algorithm for dependency hash pinning
reference_hash_file = ".build-hash-reference"  # File storing reference build hash

[tool.picodome.reproducible.requires_hashes]
# Pattern for hash-pinned requirements lines.
# Format: package==version --hash=algorithm:hash
pattern = "^(?P<name>[a-zA-Z0-9_.-]+)==(?P<version>[^;\\s]+)\\s*(?:--hash=(?P<algo>sha\\d+):(?P<hash>[a-f0-9]+))*$"
algorithms = ["sha256", "sha384", "sha512"]
