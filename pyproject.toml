[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irondome"
version = "0.1.0"
description = "Iron Dome — deterministic runtime sandbox and behavioral analysis for supply-chain security"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "KirkForge"}]
keywords = ["sandbox", "seccomp", "behavioral-analysis", "supply-chain", "security", "deterministic", "irondome"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/KirkForge/IronDome"
Repository = "https://github.com/KirkForge/IronDome"
Issues = "https://github.com/KirkForge/IronDome/issues"
Changelog = "https://github.com/KirkForge/IronDome/blob/main/CHANGELOG.md"

[project.scripts]
irondome = "irondome.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["irondome*"]

[tool.setuptools.package-data]
irondome = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "N806", "N818"]
