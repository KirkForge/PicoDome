# Iron Dome Helm values
replicaCount: 2

image:
  repository: kirkforge/irondome
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

daemon:
  host: "0.0.0.0"
  port: 8443

# Enterprise mode: requires enforcement backend, no dev bypass
enterprise:
  enabled: false

auth:
  # Comma-separated API tokens (or use existingSecret)
  # WARNING: Change this in production! Tokens must be >= 32 chars in enterprise mode.
  tokens: ""
  existingSecret: ""
  # Set to true to auto-generate a secret with a random admin token
  createSecret: true

mtls:
  enabled: false
  # Reference to a TLS secret with tls.crt, tls.key, ca.crt
  existingTLSSecret: ""
  devMode: false

metrics:
  # If true, expose /metrics on a separate port without auth
  separatePort: false
  # Port for metrics (only used if separatePort is true)
  port: 9100

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

ratelimit:
  enabled: true
  ratePerSecond: 2.0
  burstSize: 10
  globalRPS: 50.0

webhooks:
  enabled: false
  endpoints: []
  # - url: https://hooks.slack.com/services/...
  #   secret: my-signing-secret
  #   events: ["scan_alert"]
  #   minSeverity: high

slos:
  enabled: true

retention:
  scanResultsDays: 90
  auditLogsDays: 365
  baselinesDays: 0
  secureDelete: true
  storageQuotaMB: 500

monitoring:
  prometheus:
    enabled: true
    scrape: true
    port: 8443
    path: /metrics

service:
  type: ClusterIP
  port: 8443

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

networkPolicy:
  enabled: true
  ingress:
    from: []

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

healthProbe:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 30
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10