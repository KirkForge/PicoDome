# IronDome AppArmor profile for Kubernetes deployment
# Install on nodes: apparmor_parser -r irondome-apparmor.yaml
# Reference in pod spec: securityContext.appArmorProfile.type: RuntimeDefault
# Or custom profile: securityContext.appArmorProfile.type: Localhost
#                        securityContext.appArmorProfile.localhostProfile: irondome
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: irondome-apparmor-profile
  namespace: irondome
  labels:
    app: irondome
data:
  irondome: |
    #include <tunables/global>

    profile irondome flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>
      #include <abstractions/nameservice>

      # Allow reading IronDome config and policies
      /home/irondome/.irondome/** r,
      /etc/irondome/** r,

      # Allow writing scan results and audit logs
      /home/irondome/.irondome/ w,
      /home/irondome/.irondome/** rw,

      # Allow TLS cert read
      /tls/* r,

      # Allow Python execution
      /usr/bin/python3 rix,
      /usr/local/bin/irondome rix,

      # Allow seccomp operations (for sandbox)
      /usr/lib/**/libseccomp* rm,

      # Deny network except DNS and HTTPS
      network inet tcp,
      network inet6 tcp,
      network inet udp,
      network inet6 udp,

      # Deny ptrace (anti-debugging)
      ptrace (trace) deny,

      # Deny dangerous capabilities
      capability sys_admin deny,
      capability sys_ptrace deny,
      capability net_admin deny,
      capability sys_resource deny,
    }
