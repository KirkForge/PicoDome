apiVersion: apps/v1
kind: Deployment
metadata:
  name: irondome
  labels:
    app: irondome
    version: v0.4.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: irondome
  template:
    metadata:
      labels:
        app: irondome
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: irondome
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: irondome
          image: kirkforge/irondome:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8443
              protocol: TCP
          env:
            - name: IRONDOME_DAEMON_HOST
              value: "0.0.0.0"
            - name: IRONDOME_DAEMON_PORT
              value: "8443"
            - name: IRONDOME_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: irondome-tokens
                  key: api-tokens
            - name: IRONDOME_TLS_CERT
              value: "/tls/tls.crt"
            - name: IRONDOME_TLS_KEY
              value: "/tls/tls.key"
            - name: IRONDOME_TLS_CA
              value: "/tls/ca.crt"
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: data
              mountPath: /home/irondome/.irondome
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tls
          secret:
            secretName: irondome-tls
        - name: data
          persistentVolumeClaim:
            claimName: irondome-data
---
apiVersion: v1
kind: Service
metadata:
  name: irondome
  labels:
    app: irondome
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8443
      targetPort: http
      protocol: TCP
  selector:
    app: irondome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: irondome-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: irondome-tokens
type: Opaque
stringData:
  api-tokens: "irondome-admin-change-me"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irondome
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: irondome
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["irondome-tokens", "irondome-tls"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: irondome
subjects:
  - kind: ServiceAccount
    name: irondome
roleRef:
  kind: Role
  name: irondome
  apiGroup: rbac.authorization.k8s.io
