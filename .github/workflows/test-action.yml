name: Test GitHub Action

on:
  push:
    branches: [main, master]
    paths:
      - 'action.yml'
      - 'action.yaml'
      - '.github/workflows/test-action.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'action.yml'
      - 'action.yaml'
      - '.github/workflows/test-action.yml'

jobs:
  # ── Test Action Definition ───────────────────────────────────────
  test-action-syntax:
    name: Validate Action Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check action.yml exists
        run: |
          if [ ! -f action.yml ] && [ ! -f action.yaml ]; then
            echo "No action.yml or action.yaml found — skipping action tests"
            echo "This is expected if PicoDome is used as a CLI tool, not a GitHub Action"
            exit 0
          fi

      - name: Validate action YAML
        if: hashFiles('action.yml') != '' || hashFiles('action.yaml') != ''
        run: |
          python -c "
          import yaml, sys
          for f in ['action.yml', 'action.yaml']:
              try:
                  with open(f) as fh:
                      action = yaml.safe_load(fh)
                  required = ['name', 'description']
                  for key in required:
                      if key not in action:
                          print(f'Missing required key: {key}')
                          sys.exit(1)
                  print(f'✓ {f} is valid')
              except FileNotFoundError:
                  pass
          "

  # ── Test Action Integration ──────────────────────────────────────
  test-action-run:
    name: Test Action Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PicoDome
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test PicoDome CLI (sandbox)
        run: |
          python -m picodome sandbox --format json echo "action-test"

      - name: Test PicoDome CLI (pipeline)
        run: |
          python -m picodome pipeline --format json echo "action-test"

      - name: Test PicoDome CLI (determinism)
        run: |
          python -m picodome sandbox --deterministic-output --format json echo "action-det" > /tmp/run1.json
          python -m picodome sandbox --deterministic-output --format json echo "action-det" > /tmp/run2.json
          HASH1=$(sha256sum /tmp/run1.json | cut -d' ' -f1)
          HASH2=$(sha256sum /tmp/run2.json | cut -d' ' -f1)
          echo "Run 1: $HASH1"
          echo "Run 2: $HASH2"
          if [ "$HASH1" != "$HASH2" ]; then
            echo "DETERMINISM VIOLATION in action test"
            exit 1
          fi
          echo "✓ Determinism verified in action test"

      - name: Test PicoDome CLI (exit codes)
        run: |
          # ALLOW verdict should exit 0
          python -m picodome sandbox echo "allowed" || echo "sandbox exit code: $?"
          echo "✓ Action integration test passed"