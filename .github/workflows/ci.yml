name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Lint & Format ────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ── Type Check ───────────────────────────────────────────────────
  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-mypy-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run mypy
        run: mypy src/irondome

  # ── Test Matrix ──────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage (time-bounded)
        run: |
          python -m pytest -v \
            --timeout=120 \
            --timeout-method=thread \
            -m "not network" \
            --junitxml=test-results.xml \
            --cov=irondome \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json

      - name: Generate test summary
        if: always()
        run: |
          python scripts/generate_test_summary.py \
            --junitxml=test-results.xml \
            --coverage-json=coverage.json \
            --python-version=\"${{ matrix.python-version }}\" \
            --output=test-summary-${{ matrix.python-version }}.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-summary-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.json
            test-summary-${{ matrix.python-version }}.json
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ── Determinism Gate ─────────────────────────────────────────────
  determinism:
    name: Determinism Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-det-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-det-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determinism gate — run twice, compare SHA-256
        run: |
          echo "Running Iron Dome sandbox twice in deterministic mode..."
          RUN1=$(python -m irondome sandbox --deterministic-output --format json echo "deterministic" 2>/dev/null | sha256sum)
          RUN2=$(python -m irondome sandbox --deterministic-output --format json echo "deterministic" 2>/dev/null | sha256sum)
          echo "Run 1 SHA-256: $RUN1"
          echo "Run 2 SHA-256: $RUN2"
          if [ "$RUN1" != "$RUN2" ]; then
            echo "DETERMINISM VIOLATION: two runs produced different hashes"
            exit 1
          fi
          echo "✓ Determinism gate passed"

  # ── Self-Test ────────────────────────────────────────────────────
  self-test:
    name: Self-Test (Pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-selftest-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-selftest-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Self-test — irondome pipeline echo "ci-test"
        run: |
          python -m irondome pipeline echo "ci-test"

  # ── Deploy Security ──────────────────────────────────────────────
  deploy-security:
    name: Deploy Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (for Helm value parsing)
        run: pip install pyyaml

      - name: Check deployment manifests for insecure defaults
        run: python scripts/check_deploy_security.py --strict