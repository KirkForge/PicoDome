name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Self-test (L3 sandbox)
        run: python -m irondome sandbox echo "ci-test"

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Determinism gate
        run: |
          RUN1=$(python -m irondome sandbox --format json echo deterministic 2>/dev/null | sha256sum)
          RUN2=$(python -m irondome sandbox --format json echo deterministic 2>/dev/null | sha256sum)
          if [ "$RUN1" != "$RUN2" ]; then
            echo "DETERMINISM VIOLATION: two runs produced different hashes"
            exit 1
          fi
          echo "Determinism gate passed"
